version: "3.9"

services:
  db:
    image: mongo:7.0
    container_name: cognihire-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cognihire
      MONGO_INITDB_ROOT_PASSWORD: cognihire
      MONGO_INITDB_DATABASE: cognihire
    ports:
      - "27017:27017"
    volumes:
      - cognihire-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognihire-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://cognihire:cognihire@db:27017/cognihire?authSource=admin
      PORT: 3000
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run start:prod"

volumes:
  cognihire-mongo-data:
