version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: talentbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge
      POSTGRES_DB: talentbridge
    ports:
      - "5432:5432"
    volumes:
      - talentbridge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentbridge-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: talentbridge
      DB_PASSWORD: talentbridge
      DB_NAME: talentbridge
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run migration:run && npm run start:prod"

volumes:
  talentbridge-db-data:
